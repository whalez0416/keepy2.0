services:
  - type: web
    name: keepy-api
    runtime: docker
    # 유료 고객 감시는 항상 켜져 있어야 한다. 무료(free) 인스턴스는 유휴 시 잠들어
    # 스케줄러가 멈추고 인터벌 타이머가 매번 리셋되어 감시가 사실상 동작하지 않는다.
    plan: starter
    region: singapore # 한국과 가까운 지역
    envVars:
      - key: PORT
        value: 8000
      - key: DEBUG
        value: "false"
      # 데이터베이스: 반드시 관리형 PostgreSQL(Supabase/Render Postgres)을 사용한다.
      # SQLite는 재배포 시 데이터가 사라지므로 운영에서 사용 금지.
      # Render 대시보드에서 DATABASE_URL 을 postgresql://... 로 직접 입력한다.
      - key: DATABASE_URL
        sync: false
      # === 아래 값들은 Render 대시보드에서 직접 입력 (sync:false = 코드에 노출 안 함) ===
      - key: SECRET_KEY        # JWT 서명 키 (길고 랜덤한 문자열). 미설정 시 부팅 실패.
        sync: false
      - key: MASTER_EMAIL      # 마스터(운영자) 로그인 이메일
        sync: false
      - key: MASTER_PASSWORD   # 마스터(운영자) 로그인 비밀번호
        sync: false
      - key: OPENAI_API_KEY    # AI 스팸 분류용 GPT 키
        sync: false
      - key: CORS_ORIGINS      # 프론트 도메인 (예: https://app.keepy.com). 미설정 시 전체 허용.
        sync: false
      - key: SMTP_USER         # 알림 이메일 발송 계정
        sync: false
      - key: SMTP_PASSWORD     # 이메일 앱 비밀번호
        sync: false
      - key: SMTP_FROM_EMAIL   # 발신 표시 주소 (Gmail이면 SMTP_USER와 동일하게)
        sync: false
    healthCheckPath: /api/health
